name: Build Linux deployment image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up the smoke-test runner
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the existing Dockerfile off the shared host
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: world-patch:${{ github.sha }}
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/world-patch-image.tar
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Load and exercise the actual limited container
        env:
          WORLD_PATCH_IMAGE: world-patch:${{ github.sha }}
          WORLD_PATCH_SMOKE_REPORT: ${{ runner.temp }}/world-patch-artifact/container-smoke.json
        run: |
          mkdir -p "$RUNNER_TEMP/world-patch-artifact"
          docker load --input "$RUNNER_TEMP/world-patch-image.tar"
          node scripts/container-host-smoke.mjs
      - name: Package the tested image and source metadata
        env:
          WORLD_PATCH_IMAGE: world-patch:${{ github.sha }}
        run: |
          gzip -1 "$RUNNER_TEMP/world-patch-image.tar"
          mv "$RUNNER_TEMP/world-patch-image.tar.gz" "$RUNNER_TEMP/world-patch-artifact/"
          node --input-type=module -e 'import {writeFileSync,readFileSync} from "node:fs"; import {execFileSync} from "node:child_process"; const dir=process.env.RUNNER_TEMP+"/world-patch-artifact"; const image=JSON.parse(execFileSync("docker",["image","inspect",process.env.WORLD_PATCH_IMAGE],{encoding:"utf8"}))[0]; const smoke=JSON.parse(readFileSync(dir+"/container-smoke.json","utf8")); writeFileSync(dir+"/metadata.json",JSON.stringify({sourceSha:process.env.GITHUB_SHA,image:process.env.WORLD_PATCH_IMAGE,imageId:image.Id,os:image.Os,architecture:image.Architecture,createdAt:new Date().toISOString(),smokeStatus:smoke.status,buildScope:"GitHub-hosted Ubuntu runner; no registry or remote-host access"},null,2)+"\n");'
          cd "$RUNNER_TEMP/world-patch-artifact"
          sha256sum world-patch-image.tar.gz metadata.json container-smoke.json > SHA256SUMS
      - name: Upload the tested image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: world-patch-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/world-patch-artifact/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Retain smoke diagnostics when a check fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: world-patch-linux-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/world-patch-artifact/container-smoke.json
          retention-days: 3
          if-no-files-found: warn
